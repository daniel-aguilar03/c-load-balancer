name: build-and-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make test
      - run: make sanitize
      - run: python3 tools/lab.py demo --duration 1 --output reports/ci-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-${{ matrix.os }}
          path: reports/ci-demo
